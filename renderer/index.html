<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 内容安全策略：只跑自带脚本，不加载任何远程资源；本地素材预览走 file: / data: -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>分镜台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <script src="./src/theme-boot.js"></script>

    <!-- ═════════ 顶栏 ═════════ -->
    <header class="topbar">
      <div class="logo">
        <div class="mark">
          <svg viewBox="0 0 24 24">
            <path
              d="M20.6 4.6 4.9 8.2c-.9.2-1.5 1-1.4 1.9l.1.9h17.1l-1-6.4ZM2.9 12.9V18a2 2 0 0 0 2 2h14.2a2 2 0 0 0 2-2v-5.1H2.9Z"
            />
          </svg>
        </div>
        <span class="name">分镜台</span>
      </div>

      <button class="btn" id="btnProjects" title="项目列表">
        项目<svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
      </button>
      <div class="proj-title" id="projTitle" contenteditable="true" spellcheck="false">示例稿</div>

      <div class="spacer"></div>

      <div class="view-toggle" id="viewToggle">
        <button data-v="check" title="阅读原文并标注画面 (⌘T)">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <path
              d="m8 12 3 3 5-6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            /></svg
          >原文
        </button>
        <button data-v="table" class="active" title="逐句标注 (⌘T)">
          <svg viewBox="0 0 24 24">
            <path d="M8 6h13M8 12h13M8 18h13" />
            <path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" /></svg
          >表格
        </button>
      </div>

      <div class="save-state" id="saveState">
        <div class="dot"></div>
        <span id="saveTxt">已保存</span>
      </div>

      <button class="btn" id="btnImport">
        导入<svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
      </button>
      <button class="btn primary" id="btnExport">
        导出<svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
      </button>
      <button class="btn icon-only" id="btnSearch" title="搜索句子 (⌘F)">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
      </button>
      <button class="btn icon-only" id="btnTheme" title="浅色 / 深色切换 (⌘L)">
        <svg id="iconSun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg id="iconMoon" viewBox="0 0 24 24" style="display: none">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      </button>
    </header>

    <!-- ═════════ 统计 / 筛选 ═════════ -->
    <div class="stats">
      <div class="stats-inner">
        <div class="segbar" id="segbar"></div>
        <div class="meta-line">
          <div class="filters" id="filters"></div>
          <div class="progress-txt" id="progressTxt"></div>
          <div class="chip-filter" id="btnDur" title="全片与各类型的时长估算">⏱ 时长</div>
        </div>
      </div>
    </div>

    <!-- ═════════ 主体 ═════════ -->
    <div class="work-tools">
      <button class="btn" id="btnOutline" aria-expanded="true">章节目录</button>
      <button class="btn" id="btnNext">下一个未标注 ↓</button>
      <button class="btn" id="btnFocus" title="一次只看一句，按 1–5 标完自动下一句 (⌘E)">专注标注</button>
      <label class="auto-label"><input type="checkbox" id="autoAdvance" /> 标完自动跳转</label>
      <div class="spacer"></div>
      <div class="select-tools">
        <button class="btn multi-mode-button" id="btnMultiMode" aria-pressed="false">多选句子</button>
        <span class="selection-count" id="selCount" hidden></span>
        <button class="btn" id="btnGroup" disabled title="勾选连续两句以上才能共用">共用一个画面</button>
        <button class="text-button" id="btnUngroup" hidden>解除共用</button>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="btnRepair">修复分句</button>
      <button class="btn" id="btnReview">交稿检查</button>
      <button class="btn" id="btnDetail" aria-expanded="false">画面与素材</button>
    </div>
    <main class="workspace">
      <nav class="outline" id="outline" aria-label="章节目录"></nav>
      <div class="table-wrap" id="tableWrap">
        <div class="table">
          <div class="thead" id="thead">
            <div id="selectionHeading" style="text-align: center">#</div>
            <div>口播内容</div>
            <div id="durHeading" title="按语速估算；对齐剪映字幕后显示真实时间码">≈时长</div>
            <div class="h-type">类型 <kbd>1-5</kbd></div>
            <div>画面 · 备注</div>
          </div>
          <div class="rows" id="rows"></div>
        </div>
      </div>

      <aside class="inspector" id="inspector" hidden aria-label="画面与素材"></aside>
    </main>
    <!-- ═════════ 底栏 ═════════ -->
    <footer class="footbar">
      <span
        ><kbd>1–5</kbd> 标注 · <kbd>⌫</kbd> 清除 · <kbd>⌘⌫</kbd> 删句 · <kbd>↑↓</kbd> 换句 · <kbd>⌘E</kbd> 专注标注 ·
        <kbd>⌘Z</kbd> 撤销 · <kbd>⇧⌘Z</kbd> 重做</span
      >
      <div class="spacer"></div>
      <button class="text-button" id="btnHelp">快捷键与帮助</button><span>数据保存在本机</span>
    </footer>

    <!-- 搜索条 -->
    <div class="searchbar" id="searchbar">
      <input id="searchInput" placeholder="搜索句子或画面备注…" />
      <span class="cnt" id="searchCnt"></span>
      <button id="qPrev" title="上一个 (Shift+Enter)">↑</button>
      <button id="qNext" title="下一个 (Enter)">↓</button>
      <button id="qClose" title="关闭 (Esc)">✕</button>
    </div>

    <div class="toast" id="toast">
      <span class="tick">✓</span><span id="toastTxt"></span
      ><button class="toast-act" id="toastAct" style="display: none">撤销</button>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-mask" id="modalMask">
      <div class="modal">
        <h3 id="mTitle"></h3>
        <p id="mBody"></p>
        <div class="m-btns">
          <button class="btn ghost" id="mCancel">取消</button>
          <button class="btn danger" id="mOk">确认</button>
        </div>
      </div>
    </div>

    <!-- 粘贴导入弹窗 -->
    <div class="modal-mask" id="pasteMask">
      <div class="modal wide">
        <h3>粘贴整篇稿子</h3>
        <p>整篇一次粘进来就行，不用一条条弄。</p>
        <textarea
          class="paste-area"
          id="pasteArea"
          placeholder="把整篇口播稿粘到这里……

【开场钩子】
第一句话。第二句话。
【正文】
……"
        ></textarea>
        <div class="paste-hint">
          自动按<b>标点</b>分句，一句一行；<b>【】</b>或 <b>#</b> 开头的行识别为章节标题。<br />也支持粘回以前导出的<b
            >带批注 MD</b
          >，类型和备注会一起恢复。
        </div>
        <div class="m-btns">
          <button class="btn ghost" id="pasteCancel">取消</button>
          <button class="btn primary" id="pasteOk">导入</button>
        </div>
      </div>
    </div>

    <!-- 环境错误提示（被浏览器打开时） -->
    <div class="modal-mask show" id="envMask" style="display: none">
      <div class="modal">
        <h3>请从「分镜台.app」启动</h3>
        <p id="envBody">
          这个页面是分镜台的界面文件，被浏览器打开时存不了数据。<br />请回到「应用程序」文件夹双击「分镜台」启动。
        </p>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
