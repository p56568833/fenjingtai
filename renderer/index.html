<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 内容安全策略：只跑自带脚本；图片 / 视频可以读本地文件和网上地址（视频审核要直接播放、截图在线视频）；界面本身不发任何网络请求（connect-src 只有自己） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: blob: https: http:; media-src 'self' file: blob: https: http:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>分镜台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <script src="./src/theme-boot.js"></script>

    <!-- ═════════ 顶栏 ═════════ -->
    <header class="topbar">
      <div class="logo">
        <div class="mark">
          <svg viewBox="0 0 24 24">
            <path
              d="M20.6 4.6 4.9 8.2c-.9.2-1.5 1-1.4 1.9l.1.9h17.1l-1-6.4ZM2.9 12.9V18a2 2 0 0 0 2 2h14.2a2 2 0 0 0 2-2v-5.1H2.9Z"
            />
          </svg>
        </div>
        <span class="name">分镜台</span>
      </div>

      <button class="btn" id="btnProjects" title="项目列表">
        项目<svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
      </button>
      <div class="proj-title" id="projTitle" title="项目名称">示例稿</div>

      <div class="spacer"></div>

      <!-- 视图切换：视频审核 ↔ 表格。底下的白色滑块跟着选中项左右滑（弹簧动效）。
           原文视图暂时不放入口（按钮隐藏，代码保留，需要时去掉 hidden 即可恢复） -->
      <div class="view-toggle" id="viewToggle" role="tablist" aria-label="视图">
        <span class="vt-pill" aria-hidden="true"></span>
        <button data-v="review" role="tab" title="视频审核：过目 Claude 找的候选视频，通过 / 不要 / 换一个 (⌘T)">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="3" />
            <path d="m10.5 9.5 4 2.5-4 2.5z" /></svg
          >审核<span class="vt-badge" id="vtBadge" hidden></span>
        </button>
        <button data-v="check" hidden title="阅读原文并标注画面">原文</button>
        <button data-v="table" class="active" role="tab" title="逐句标注 (⌘T)">
          <svg viewBox="0 0 24 24">
            <path d="M8 6h13M8 12h13M8 18h13" />
            <path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" /></svg
          >表格
        </button>
      </div>

      <button class="btn update-btn" id="btnUpdate" hidden title="有新版本" aria-label="查看更新详情">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4" /></svg>
        <span id="updButtonLabel">更新</span>
      </button>
      <div class="save-state" id="saveState">
        <div class="dot"></div>
        <span id="saveTxt">已保存</span>
      </div>

      <button class="btn" id="btnImport">
        导入<svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
      </button>
      <button class="btn primary" id="btnExport">
        导出<svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
      </button>
      <button class="btn icon-only" id="btnSearch" title="搜索句子 (⌘F)">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
      </button>
      <button class="btn icon-only" id="btnTheme" title="浅色 / 深色切换 (⌘L)">
        <svg id="iconSun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg id="iconMoon" viewBox="0 0 24 24" style="display: none">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      </button>
    </header>

    <div id="tablePage" class="workspace-page">
      <!-- ═════════ 节奏色条（一句一段，平时细细一条，鼠标移上去才展开） ═════════ -->
      <div class="stats">
        <div class="segbar" id="segbar"></div>
      </div>

      <!-- ═════════ 工具条：目录 / 筛选 / 标注工具（有未标注才出现）/ 进度 / 类型 / 时长 / 面板 ═════════ -->
      <div class="work-tools">
        <button class="btn icon-only" id="btnOutline" aria-expanded="true" title="章节目录">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
        </button>
        <div class="filters" id="filters"></div>
        <div class="mark-tools" id="markTools">
          <button class="btn" id="btnNext" title="跳到下一个还没标注的句子">下一个未标注 ↓</button>
          <button class="btn" id="btnFocus" title="一次只看一句，按数字键标完自动下一句 (⌘E)">专注标注</button>
          <label class="auto-label" title="标完一句自动跳到下一个未标注"
            ><input type="checkbox" id="autoAdvance" /> 标完自动跳转</label
          >
        </div>
        <div class="work-right">
          <button class="text-button repair-hint" id="repairHint" hidden></button>
          <div class="progress-txt" id="progressTxt"></div>
          <button class="chip-filter chip-tool" id="btnTypes" title="改本项目的标注类型：名字、颜色、快捷键">
            类型…
          </button>
          <button class="chip-filter chip-tool" id="btnDur" title="全片时长、语速、剪映字幕、口播音频">
            ⏱ 时长 · 口播
          </button>
          <button class="btn" id="btnDetail" aria-expanded="false" title="右侧面板：画面描述、素材、对应的口播">
            画面与素材
          </button>
        </div>
      </div>
      <main class="workspace">
        <nav class="outline" id="outline" aria-label="章节目录"></nav>
        <div class="table-wrap" id="tableWrap">
          <div class="table">
            <div class="thead" id="thead">
              <div id="selectionHeading" style="text-align: center">#</div>
              <div>口播内容</div>
              <div id="durHeading" title="按语速估算；对齐剪映字幕后显示真实时间码">≈时长</div>
              <div class="h-type">类型 <kbd id="typeKeys">1-5</kbd></div>
              <div>画面 · 备注</div>
            </div>
            <div class="rows" id="rows"></div>
          </div>
        </div>

        <aside class="inspector" id="inspector" hidden aria-label="画面与素材"></aside>

        <!-- 选区操作条：选中两句以上 / 选中共用画面里的句子时才浮出来 -->
        <div class="select-tools" id="selectTools" hidden>
          <span class="selection-count" id="selCount" hidden></span>
          <span class="sel-types" id="selTypes" role="group" aria-label="把选中的句子标成"></span>
          <button class="btn" id="btnGroup" disabled title="Shift 点选或拖选连续两句以上才能共用">共用一个画面</button>
          <span class="sel-hint" id="selHint" hidden></span>
          <button class="text-button" id="btnUngroup" hidden>解除共用</button>
          <button class="text-button" id="btnClearSel" title="取消勾选 (Esc)">取消</button>
        </div>
      </main>
      <!-- ═════════ 口播条（导入口播音频后出现） ═════════ -->
      <div class="voice-bar" id="voiceBar" hidden></div>
    </div>

    <!-- 搜索条 -->
    <div class="searchbar" id="searchbar">
      <input id="searchInput" placeholder="搜索句子或画面备注…" />
      <span class="cnt" id="searchCnt"></span>
      <button id="qPrev" title="上一个 (Shift+Enter)">↑</button>
      <button id="qNext" title="下一个 (Enter)">↓</button>
      <button id="qClose" title="关闭 (Esc)">✕</button>
    </div>

    <div class="toast" id="toast">
      <span class="tick">✓</span><span id="toastTxt"></span
      ><button class="toast-act" id="toastAct" style="display: none">撤销</button>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-mask" id="modalMask">
      <div class="modal">
        <h3 id="mTitle"></h3>
        <p id="mBody"></p>
        <div class="m-btns">
          <button class="btn ghost" id="mCancel">取消</button>
          <button class="btn danger" id="mOk">确认</button>
        </div>
      </div>
    </div>

    <!-- 粘贴导入弹窗 -->
    <div class="modal-mask" id="pasteMask">
      <div class="modal wide">
        <h3>粘贴整篇稿子</h3>
        <p>整篇一次粘进来就行，不用一条条弄。</p>
        <textarea
          class="paste-area"
          id="pasteArea"
          placeholder="把整篇口播稿粘到这里……

【开场钩子】
第一句话。第二句话。
【正文】
……"
        ></textarea>
        <div class="paste-hint">
          自动按<b>标点</b>分句，一句一行；<b>【】</b>或 <b>#</b> 开头的行识别为章节标题。<br />也支持粘回以前导出的<b
            >带批注 MD</b
          >，类型和备注会一起恢复。
        </div>
        <div class="m-btns">
          <button class="btn ghost" id="pasteCancel">取消</button>
          <button class="btn primary" id="pasteOk">导入</button>
        </div>
      </div>
    </div>

    <!-- 环境错误提示（被浏览器打开时） -->
    <div class="modal-mask show" id="envMask" style="display: none">
      <div class="modal">
        <h3>请从「分镜台.app」启动</h3>
        <p id="envBody">
          这个页面是分镜台的界面文件，被浏览器打开时存不了数据。<br />请回到「应用程序」文件夹双击「分镜台」启动。
        </p>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
